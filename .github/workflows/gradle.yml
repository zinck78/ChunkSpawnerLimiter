name: Java CI with Gradle (kotlin)

on:
  push:
    branches: [ master, 'feature/**' ]
  pull_request:
    branches: [ master, 'feature/**' ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build with Gradle
        run: ./gradlew build
      - name: Upload test plugin jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ChunkSpawnerLimiter-shared-groups-test
          path: build/libs/chunkspawnerlimiter-*.jar
          if-no-files-found: error

  dependency-submission:
    # The upstream repository has dependency submissions enabled; new forks
    # may not have their dependency graph enabled yet.
    if: github.repository == 'sarhatabaot/ChunkSpawnerLimiter' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Generates and submits a dependency graph, enabling Dependabot Alerts for all project dependencies.
      # See: https://github.com/gradle/actions/blob/main/dependency-submission/README.md
      - name: Generate and submit dependency graph
        uses: gradle/actions/dependency-submission@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
