# Actuality-specific configuration preset for ChunkSpawnerLimiter.
# Copy to plugins/ChunkSpawnerLimiter/config.yml, retaining a backup.
# A chunk (16x16, full world height) permits:
#   - at most 16 of any individual listed livestock type
#   - at most 48 livestock across all listed types COMBINED
#   - at most 8 villagers (separate from the livestock allowance)
# STRONGER POLICY: if a chunk contains more than its population cap,
# excess residents ARE removed on load/movement/name-tagging, unnamed first.
# If 17 out of 17 cows are named, one named cow will be removed.
# Removal does not drop loot or refund name tags. Back up populated worlds.
# Wandering traders and hostile types are not in this list.
# MythicMobs based on a listed animal type still count toward these caps.
enabled: true
debug-messages: false
metrics: false

events:
  spawn:
    creature: true
    vehicle: true
    entity: true
  inspections:
    enabled: false
    frequency: 60
    max-chunks-per-tick: 8

entities:
  entity-groups:
    LIVESTOCK:
      - COW
      - MOOSHROOM
      - SHEEP
      - PIG
      - CHICKEN
      - GOAT
      - RABBIT
      - HORSE
      - DONKEY
      - MULE
      - LLAMA
      - CAMEL
      - BEE
      - WOLF
      - CAT
      - FOX
      - FROG
      - AXOLOTL
      - TURTLE
      - ARMADILLO
      - SNIFFER
      - PANDA
      - PARROT
    NPC:
      - VILLAGER
  limits:
    LIVESTOCK: 16
    VILLAGER: 8
  group-total-limits:
    LIVESTOCK: 48
  compatibility:
    defer-count-until-next-tick: false
  preservation:
    # Name-tagged mobs have cleanup priority, not absolute immunity.
    named-entities: false
    raid-entities: true
  removal:
    mode: prevent
    # Actuality addition: opt in to trimming existing population overflows.
    trim-existing-overflow: true
    armor-stand:
      drop: false
      log-warnings: false
    kill-players: false
  ignore:
    metadata:
      - shopkeeper
    nbt: []

# Only configure reasons relevant to natural populations and player-controlled
# spawns. CHUNK_GEN is intentionally omitted to preserve natural villages.
# Unknown spawn reasons are harmless; the plugin matches names.
spawn-reasons:
  - BREEDING
  - NATURAL
  - DEFAULT
  - SPAWNER_EGG
  - DISPENSE_EGG
  - EGG
  - CUSTOM
  - COMMAND
  - CURED
  - MOUNT

# We are not using this plugin to restrict block placement.
blocks:
  block-groups: {}
  limits: {}

worlds:
  mode: excluded
  list:
    - instances

notifications:
  enabled: true
  cooldown-seconds: 3
  method:
    title: false
    message: true
  messages:
    entities-blocked: "&cAnimal population limit reached in this chunk. Try expanding your farm." 
    breeding-blocked: "&cBreeding blocked: &e{scope} &7is full (&e{count}/{limit}&7). Move animals to another chunk."
    entities-removed: "&ePopulation limit enforced: &f{count} {type} &eremoved (unnamed first)."
    reload-complete: "&aEntity limits reloaded."
    max-blocks: "&cBlock cap reached."
    max-blocks-title: "&cBlock cap reached."
    max-blocks-subtitle: "&cLimit reached."
